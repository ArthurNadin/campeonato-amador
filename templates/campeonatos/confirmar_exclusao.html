{% extends 'base.html' %}
{% block titulo %}Confirmar exclusão{% endblock %}

{% block conteudo %}
<section class="cartao estreito">
  <h1>Confirmar exclusão</h1>
  <p>Tem certeza de que deseja excluir <strong>{{ object }}</strong>?</p>
  {% if aviso %}<p class="mensagem warning">{{ aviso }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="botoes">
      <button type="submit" class="botao perigo">Excluir</button>
      <a class="botao secundario" href="{{ voltar_url }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
